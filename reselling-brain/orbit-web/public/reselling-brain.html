<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit · Reselling Brain</title>
<link rel="stylesheet" href="/orbit-visual-system.css"><link rel="stylesheet" href="/reselling-brain.css"><script src="/orbit-standalone-a11y.js" defer></script><script src="/reselling-brain.js" defer></script></head>
<body><main><header><a href="/">← Orbit</a><p class="eyebrow">RESELLER PROGRAM</p><h1>Reselling Brain</h1><p>Ask anything about policy, churn rules, SLAs, partners and processes. Answers come from the Reselling Brain only. It never sends anything to partners.</p></header>
<p id="message" role="status" aria-live="polite">Checking your access…</p>
<section id="chatPanel" hidden>
<div id="log" class="brain-log" aria-live="polite"></div>
<form id="askForm"><label for="question">Your question</label><textarea id="question" rows="3" maxlength="2000" dir="auto" placeholder="e.g. Can we refund a merchant 40 days after the invoice?" required></textarea>
<div class="bar"><button type="submit" id="send">Ask</button><button type="button" id="clear" class="secondary">New conversation</button></div></form>
<p class="muted" id="levelNote"></p>
</section>
</main></body></html>
