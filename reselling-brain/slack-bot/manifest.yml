display_information:
  name: Reselling Brain
  description: Answers any question about the Foodics Reseller Program
  background_color: "#1d1f2b"
features:
  bot_user:
    display_name: Reselling Brain
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - im:read
      - im:write
      - files:read
      - channels:read
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
